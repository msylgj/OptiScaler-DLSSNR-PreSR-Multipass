name: Package NR Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version label'
        required: true
        default: 'nr-dev'
        type: string
      EnableRtx40Mfg:
        description: 'Include the RTX 40 MFG unlock in the package'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Package
        shell: powershell
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          ENABLE_RTX40_MFG: ${{ inputs.EnableRtx40Mfg }}
        run: |
          $enableRtx40Mfg = $env:ENABLE_RTX40_MFG -eq 'true'
          ./package_release.ps1 -Version $env:PACKAGE_VERSION -EnableRtx40Mfg:$enableRtx40Mfg
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: OptiScaler-NR-${{ inputs.version }}
          path: release/*.zip
          if-no-files-found: error
