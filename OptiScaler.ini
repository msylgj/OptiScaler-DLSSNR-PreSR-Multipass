; -------------------------------------------------------
[Upscalers]
; -------------------------------------------------------
; 为 DX11 游戏选择超分辨率后端
; fsr22（原生 DX11）、fsr31（原生 DX11）、xess（原生 DX11，仅限 Arc）、xess_12（dx11on12）、fsr21_12（dx11on12）、fsr22_12（dx11on12）、ffx_12（FSR 2.3; 3.1; 4.x）、dlss（原生 DX11）、dlss_12（支持 DLSS 与 NR 的 DX12 桥接）— 默认（auto）为 fsr22
Dx11Upscaler=auto

; 为 DX12 游戏选择超分辨率后端
; xess, fsr21, fsr22, ffx (FSR 2.3; 3.1; 4.x), dlss
; 默认（auto）：GPU 支持时使用 DLSS，其次在 GPU 支持时使用 FSR4，否则使用 XeSS
Dx12Upscaler=auto

; 为 Vulkan 游戏选择超分辨率后端
; fsr21（原生 VK）、fsr22（原生 VK）、ffx（原生 FSR 2.3; 3.1）、xess（原生 VK）、fsr21_12（VKon12）、ffx_12（FSR 2.3; 3.1; 4.x）、dlss（原生 DX11）、dlss_12（支持 DLSS 与 NR 的 DX12 桥接）— 默认（auto）为 fsr22
VulkanUpscaler=auto



; -------------------------------------------------------
[FrameGen]
; -------------------------------------------------------
; 启用帧生成
; true 或 false — 默认（auto）为 false
Enabled=auto

; 选择帧生成输入源
; dlssg    - 可搭配任意帧生成输出，原生支持无 HUD 画面。仅适用于使用 Streamline 和 DLSSG 的游戏
; nvngxfg  - 仅限 FSR 3 FG（使用 DLSS Enabler 的 DLL 时支持 MFG）。游戏须具备 DLSSG，原生支持无 HUD 画面，使用 Streamline 交换链控制帧节奏
; fsrfg    - 可搭配任意帧生成输出，原生支持无 HUD 画面
; upscaler - 必须启用超分辨率。可搭配任意帧生成输出，但部分组合可能存在问题。为防止 UI 错乱，需要使用 Hudfix
; fsrfg30  - 可搭配任意帧生成输出，原生支持无 HUD 画面
; nofg、dlssg、nvngxfg、fsrfg、upscaler、fsrfg30 — 默认（auto）为 nofg
FGInput=auto

; 选择帧生成输出
; fsrfg          - 需要 amd_fidelityfx_dx12.dll，或 amd_fidelityfx_loader_dx12.dll + amd_fidelityfx_framegeneration_dx12.dll
; xefg           - 需要 libxess_fg.dll 和 libxell.dll
; dlssg          - 需要 'OptiScaler/streamline' 文件夹内的 Streamline DLL，以及 nvngx_dlssg.dll
; nofg、fsrfg、xefg、dlssg — 默认（auto）为 nofg
FGOutput=auto

; 选择 Nvngx 帧生成替代实现
; Nvngx FG 是底层 DLSSG 提供者。仅在 FGInput=NvngxFG 或 FGOutput=DLSSG 时，此设置才会生效
; 例如，在仅支持超分辨率的游戏中使用 Nukems：FGInput=upscaler, FGOutput=dlssg, FGNvngxReplacement=Nukems
; 在已支持 DLSSG 的游戏中使用 Arturs：FGInput=nvngxfg, FGOutput=auto, FGNvngxReplacement=Arturs
; None      - 不替换
; Nukems    - 需要 dlssg_to_fsr3_amd_is_better.dll，提供 FSR 3 FG
; Arturs    - 需要 dlss-enabler-headless.dll，提供 FSR 3 MFG
; FFX       - 需要 amd_fidelityfx_dx12.dll，或 amd_fidelityfx_loader_dx12.dll + amd_fidelityfx_framegeneration_dx12.dll，提供 FSRFG 3 或 4
; Combo     - 同时需要 FFX 和 Arturs 的依赖，中间帧使用 FFX，其余帧使用 Enabler。可在 4x 和 6x 模式下组合 FSR 4 FG 与 Enabler
; None、Nukems、Arturs、FFX、Combo — 默认（auto）为 Nukems
FGNvngxReplacement=auto

; 帧时间来源，会影响帧节奏
; 0：输入（DLSSG/FSRFG/OptiFG）| 1：Present 调用之间的时间 | 2：零（仅限 XeFG）
; true 或 false — 默认（auto）为 0
FTInput=auto

; 启用帧生成调试视图
; true 或 false — 默认（auto）为 false
DebugView=auto

; 在生成帧上绘制 UI，需要无 HUD 画面和 UI 纹理，主要用于 FSR FG
; true 或 false — 默认（auto）为 false
DrawUIOverFG=auto

; 设置所提供 UI 纹理的类型；搭配 DrawUIOverFG 和 FSR FG 时会改变 UI 的显示效果
; true 或 false — 默认（auto）为 true
UIPremultipliedAlpha=auto

; 控制是否禁用无 HUD 画面，即使帧生成源已提供该画面
; true 或 false — 默认（auto）为 false
DisableHudless=auto

; 控制是否禁用 UI 纹理，即使帧生成源已提供该纹理
; true 或 false — 默认（auto）为 true
DisableUI=auto

; 忽略帧生成输入发出的 Reset 信号
; true 或 false — 默认（auto）为 false
SkipReset=auto

; 定义帧生成区域矩形
; 整数 — 默认（auto）为整个屏幕
RectLeft=auto
RectTop=auto
RectWidth=auto
RectHeight=auto

; 允许帧生成领先游戏的帧数
; 可能避免帧生成反复开关，但也可能引发问题
; 1 至 3 — 默认（auto）为 1
AllowedFrameAhead=auto

; 始终将深度纹理标记为 ValidNow
; 会占用更多显存，但 Uniscaler 需要此设置
; true 或 false — 默认（auto）为 false
DepthValidNow=auto

; 始终将运动矢量纹理标记为 ValidNow
; 会占用更多显存，但 Uniscaler 需要此设置
; true 或 false — 默认（auto）为 false
VelocityValidNow=auto

; 始终将无 HUD 画面标记为 ValidNow
; 会占用更多显存，但 Uniscaler 需要此设置
; true 或 false — 默认（auto）为 false
HudlessValidNow=auto

; 如果输入源标记了多个无 HUD 画面，仅使用第一个
; true 或 false — 默认（auto）为 false
OnlyAcceptFirstHudless=auto

; 保留帧生成交换链，阻止其被释放
; 可能避免释放交换链时发生崩溃
; true 或 false — 默认（auto）为 true
PreserveSwapChain=auto

; 当交换链的新旧描述相同时，
; 跳过对交换链的 ResizeBuffers 调用
; 可防止 ResizeBuffers 调用后的崩溃
; true 或 false — 默认（auto）为 true
SkipResizeBuffers=auto

; 通常在调用 ResizeBuffers 后，交换链缓冲区
; 应处于 COMMON 状态。启用此选项后，
; OptiScaler 会在跳过 ResizeBuffers 调用时
; 尝试设置交换链缓冲区状态
; 可能引发崩溃，也可能修复崩溃
; true 或 false — 默认（auto）为 false
ModifyBufferState=auto

; 通常在调用 ResizeBuffers 后，交换链当前索引
; 应为 0。启用此选项后，
; OptiScaler 会通过调用 Present 来调整交换链索引，
; 直到索引变为 0
; 可能引发崩溃，也可能修复崩溃
; true 或 false — 默认（auto）为 false
ModifySCIndex=auto

; 对 UI 透明度应用截断，以辅助插帧
; 仅适用于 FSR FG 输出和 NvngxFG
; 0.0 - 1.0 — 默认（auto）为 0.0，已知可修复特定游戏时除外
HudCutoff=auto



; -------------------------------------------------------
[FSRFG]
; -------------------------------------------------------
; 启用 FSR3.1 帧生成撕裂调试线
; true 或 false — 默认（auto）为 false
DebugTearLines=auto

; 启用 FSR3.1 帧生成插帧跳过调试线
; true 或 false — 默认（auto）为 false
DebugResetLines=auto

; 启用 FSR3.1 帧生成帧节奏调试线
; true 或 false — 默认（auto）为 false
DebugPacingLines=auto

; 启用异步 FSR3.1 帧生成
; true 或 false — 默认（auto）为 false
AllowAsync=auto

; 为帧生成交换链的 Present 调用启用互斥锁
; 禁用后可能提升性能，但会牺牲稳定性
; true 或 false — 默认（auto）为 true
UseMutexForSwapchain=auto

; 帧节奏调优
; -------------------------------------------------------
; 启用自定义帧节奏调优参数
; true 或 false — 默认（auto）为 true
FramePacingTuning=auto

; 以下信息来源：
; https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/blob/54fbaafdc34716811751bea5032700e78f5a0f33/ffx-api/include/ffx_api/ffx_api_types.h#L197
;
; 默认调优参数
; safetyMarginInMs==0.1ms，varianceFactor==0.1。
; 
; 调优方案 A
; safetyMarginInMs==0.75ms，varianceFactor==0.1。
;
; 调优方案 B
; safetyMarginInMs==0.01ms，varianceFactor==0.3。
;
; 如果使用帧生成时，从复杂场景逐渐过渡到简单场景后，帧率仍异常偏低，
; 可尝试“调优方案 B”恢复损失的 FPS，代价是帧时间波动略有增大。
;
; OptiScaler 默认使用调优方案 B

; 帧节奏调优
; 设置安全余量
; 浮点数 — 默认（auto）为 0.01
FPTSafetyMarginInMs=auto

; 帧节奏调优
; 设置方差系数
; 0.0 - 1.0 - 默认（auto）为 0.3
FPTVarianceFactor=auto

; 帧节奏调优
; 允许帧节奏自旋锁休眠，应可降低 CPU 占用
; 可能导致 FPS 回升较慢
; true 或 false — 默认（auto）为 false
FPTHybridSpin=auto

; 帧节奏调优
; FPTHybridSpin=true 时的自旋时长，以计时器分辨率为单位
; 不建议低于 2，否则会频繁超时
; 无符号整数 — 默认（auto）为 2
FPTHybridSpinTime=auto

; 帧节奏调优
; 允许使用 WaitForSingleObject 等待 fence 值，而非自旋等待
; true 或 false — 默认（auto）为 false
FPTWaitForSingleObjectOnFence=auto

; 启用 FSR-FG Redstone 水印
; true 或 false — 默认（auto）为 false
EnableWatermark=auto



; -------------------------------------------------------
[XeFG]
; -------------------------------------------------------
; 跳过 XeFG 初始化前检查
; 可能导致画质异常或崩溃！
; true 或 false — 默认（auto）为 false
IgnoreInitChecks=auto

; 设置插入帧数量（MFG）
; 1 = 2X | 2 = 3X | 3 = 4X
; true 或 false — 默认（auto）为 1
InterpolationCount=auto

; XeFG DepthInverted（反向深度）标志
; true 或 false — 默认（auto）为 true
DepthInverted=auto

; 禁用 UI 插帧
; 仅在提供无 HUD 画面时有效
; true 或 false — 默认（auto）为 false
UIComposition=auto

; XeFG JitteredMV（带抖动运动矢量）标志
; true 或 false — 默认（auto）为 false
JitteredMV=auto

; XeFG HighResMV（高分辨率运动矢量）标志
; true 或 false — 默认（auto）为 false
HighResMV=auto

; 启用 XeFG 调试方块
; true 或 false — 默认（auto）为 false
DebugView=auto

; 强制使用无边框模式，而非独占全屏
; 切换模式时可能引发稳定性问题；
; 当独占全屏分辨率低于显示器分辨率时，
; 也可能引发画质问题
; true 或 false — 默认（auto）为 false
ForceBorderless=auto



; -------------------------------------------------------
[DLSSG]
; 实验性内置 RTX 40 MFG 解锁。保存并重启；需要受支持的 DLSSG 运行库
AdaMfgUnlock=false
; 修复 2X 以上额外生成帧的时序，使各帧落在各自的时间点，而非全部位于中点
; auto     - 复用模块已包含的 Blackwell 插帧内核（RTX 40 上的默认方式）
; retarget - 同上，但显式选择此方式
; ptx      - 改写 Ada 内核的 PTX。仅适用于可识别的 DLSSG 版本；每次运行仅使用一种方法
; 修改后请保存设置并重启
AdaTemporalFix=auto
; 软件帧节奏控制。仅在 3X 或更高倍率导致画面冻结时使用：硬件 Flip Metering 开启时，
; 请求生成多于一帧可能使画面呈现冻结。此选项在加载时修改 NVIDIA Streamline DLSS-G 插件
; （sl.dlss_g）的内存代码，使其进入自身的软件帧节奏回退路径。仅在插件代码结构
; 可被识别时才会修改。请先尝试更温和的 [NvApi] DisableFlipMetering=true
; 需要 AdaMfgUnlock=true。修改后请保存设置并重启
AdaFlipMeteringPatch=false

; -------------------------------------------------------
; 设置插入帧数量（MFG）
; 1 = 2X | 2 = 3X | 3 = 4X | 4 = 5X | 5 = 6X
; true 或 false — 默认（auto）为 1
InterpolationCount=auto

; 默认（auto）为 true
UseGamesReflexMarkers=auto

; 覆盖游戏发送给 SL 的数值；可能用于 Nvngx FG，也可能在使用原生 DLSSG 时用于 noFG
; 默认（auto）不覆盖
OverrideInterpolationCount=auto

; 尝试在游戏原生 DLSSG 中强制启用动态 MFG。需要 NVIDIA Blackwell 或任意 AMD/Intel 显卡（Nvngx FG）
; 需要 Streamline 2.11
; 默认（auto）为 false
OverrideForceDMFG=auto

; 在 OptiScaler 自身的 DLSSG 输出中强制启用动态 MFG。需要 NVIDIA Blackwell 或任意 AMD/Intel 显卡（Nvngx FG）
; 需要 Streamline 2.11
; 默认（auto）为 false
ForceDMFG=auto


; 设置动态多帧生成的目标 FPS
; 非零时无法手动调整帧生成倍率
; 需要启用 DMFG
; 默认（auto）为 0.0（显示器刷新率）
FramerateTargetDMFG=auto



; -------------------------------------------------------
[OptiFG]
; -------------------------------------------------------

; 禁用 HUDFix 资源跟踪，
; 搭配能够自行处理 HUD 元素的
; 机器学习帧生成器时，可降低 CPU 开销
; true 或 false — 默认（auto）为 false
DisableHUDFix=auto

; 启用帧生成所需的 HUDFix 无 HUD 画面跟踪
; 可能引发崩溃，尤其在启用异步时
; true 或 false — 默认（auto）为 false
HUDFix=auto

; 延迟无 HUD 画面的捕获
; 可能引发崩溃，尤其是设置过高时！
; 大于 0 的整数 — 默认（auto）为 1
HUDLimit=auto

; 扩展无 HUD 画面检查，以支持更多图像格式
; 可能引发崩溃和性能下降
; true 或 false — 默认（auto）为 false
HUDFixExtended=auto

; 不使用 CreateRenderTargetView 跟踪资源
; true 或 false — 默认（auto）为 false
HudfixDisableRTV=auto

; 不使用 CreateShaderResourceView 跟踪资源
; true 或 false — 默认（auto）为 false
HudfixDisableSRV=auto

; 不使用 CreateUnorderedAccessView 跟踪资源
; true 或 false — 默认（auto）为 false
HudfixDisableUAV=auto

; 不使用 OMSetRenderTargets 跟踪资源
; true 或 false — 默认（auto）为 false
HudfixDisableOM=auto

; 不使用 SetComputeRootDescriptorTable 跟踪资源
; true 或 false — 默认（auto）为 true
HudfixDisableSCR=auto

; 不使用 SetGraphicsRootDescriptorTable 跟踪资源
; true 或 false — 默认（auto）为 true
HudfixDisableSGR=auto

; 不使用 DrawInstanced 跟踪资源
; true 或 false — 默认（auto）为 false
HudfixDisableDI=auto

; 不使用 DrawIndexedInstanced 跟踪资源
; true 或 false — 默认（auto）为 false
HudfixDisableDII=auto

; 不使用 Dispatch 跟踪资源
; true 或 false — 默认（auto）为 false
HudfixDisableDispatch=auto

; 禁止将交换链缓冲区用作无 HUD 画面
; 可能修复叠加层问题，但也可能降低兼容性
; true 或 false — 默认（auto）为 false
HUDFixDontUseSwapchainBuffers=auto

; 放宽无 HUD 画面的分辨率检查，每个轴最多允许 5% 的差异
; 有助于在特定分辨率和宽高比下使用黑边的游戏（如《巫师 3》）
; true 或 false — 默认（auto）为 false
HUDFixRelaxedResolutionCheck=auto

; 允许在着色器执行前捕获资源
; 可提高无 HUD 画面的捕获机会，但也可能捕获不必要的资源
; true 或 false — 默认（auto）为 false
HUDFixImmediate=auto

; 为无 HUD 资源启用新的高级绑定跟踪系统
; 设为 false 可恢复旧版 Hudfix 行为
; true 或 false — 默认（auto）为 true
HUDFixPersistentBindings=auto

; 无论 Hudfix 设置如何，始终启用资源跟踪
; 可能影响性能，但禁用后可能引发稳定性问题
; true 或 false — 默认（auto）为 false
AlwaysTrackHeaps=auto

; 使用分片而非单个互斥锁跟踪资源
; 可能提升重度多线程游戏的性能
; true 或 false — 默认（auto）为 false
UseShards=auto

; 禁止将很少使用的资源用作无 HUD 画面，
; 以避免闪烁和其他问题
; true 或 false — 默认（auto）为 false
ResourceBlocking=auto

; 复制深度纹理，供 Hudfix 帧生成调用使用
; 设为 false 很可能导致偶发画面错乱
; true 或 false — 默认（auto）为 true
MakeDepthCopy=auto

; 根据 DepthScaleMax 的值缩放深度缓冲区
; 修复 DLSS-D + UE 的深度缓冲区信息异常
; true 或 false — 默认（auto）为 false
EnableDepthScale=auto

; EnableDepthScale 使用的缩放值
; 深度值将除以此数值
; 浮点数 — 默认（auto）为 10000.0
DepthScaleMax=auto

; 复制运动矢量，供 Hudfix 帧生成调用使用
; 设为 false 很可能导致偶发画面错乱
; true 或 false — 默认（auto）为 true
MakeMVCopy=auto

; 翻转深度和运动矢量纹理
; 应可修复 Unity 游戏中的 OptiFG 问题
; true 或 false — 默认（auto）为 false
ResourceFlip=auto

; 根据插帧区域翻转深度和运动矢量纹理
; 应可修复 Unity 游戏中的 OptiFG 问题
; true 或 false — 默认（auto）为 false
ResourceFlipOffset=auto

; 始终捕获 FSR-FG 3.1 交换链，并将其替换为所选输出
; 应可修复某些游戏创建但不使用 FSR-FG 交换链时
; 出现的重复 Present 调用问题（如《寂静岭 f》）
; true 或 false — 默认（auto）为 false
AlwaysCaptureFSRFGSwapchain=auto



; -------------------------------------------------------
[Inputs]
; -------------------------------------------------------
; OptiScaler 将挂钩 nvngx.dll，并使用 DLSS 输入
; true 或 false — 默认（auto）为 true
EnableDlssInputs=auto

; OptiScaler 将挂钩 libxess.dll，并使用 XeSS 输入
; true 或 false — 默认（auto）为 true
EnableXeSSInputs=auto

; OptiScaler 将挂钩 FSR2 输入
; true 或 false — 默认（auto）为 true
EnableFsr2Inputs=auto

; OptiScaler 将挂钩 FSR2 的 DX11 输入，而非 DX12 输入
; true 或 false — 默认（auto）为 false
UseFsr2Dx11Inputs=auto

; OptiScaler 将挂钩 FSR2 的 Vulkan 输入，而非 DX11 和 DX12 输入
; true 或 false — 默认（auto）为 false
UseFsr2VulkanInputs=auto

; OptiScaler 将使用 FSR2 输入
; true 或 false — 默认（auto）为 true
UseFsr2Inputs=auto

; 尝试通过模式匹配查找 FSR2 方法
; 会减慢游戏加载速度
; true 或 false — 默认（auto）为 false
Fsr2Pattern=auto

; OptiScaler 将挂钩 FSR3 输入
; true 或 false — 默认（auto）为 true
EnableFsr3Inputs=auto

; OptiScaler 将使用 FSR3 输入
; true 或 false — 默认（auto）为 true
UseFsr3Inputs=auto

; 尝试通过模式匹配查找 FSR3 方法
; 会减慢游戏加载速度
; true 或 false — 默认（auto）为 false
Fsr3Pattern=auto

; OptiScaler 将挂钩 FidelityFX（amd_fidelityfx_dx12.dll）API 输入
; true 或 false — 默认（auto）为 true
EnableFfxInputs=auto

; OptiScaler 将使用 FidelityFX API 输入
; true 或 false — 默认（auto）为 true
UseFfxInputs=auto

; 允许在游戏的 FSR3.1 超分辨率后端与 OptiScaler 所选后端之间热切换
; true 或 false — 默认（auto）为 false
EnableHotSwapping=auto



; -------------------------------------------------------
[FSRFGInputs]
; -------------------------------------------------------
; 不使用 ffxConfig 设置的无 HUD 画面
; true 或 false — 默认（auto）为 false
SkipConfigForHudless=auto

; 不使用 ffxDispatch 设置的无 HUD 画面
; true 或 false — 默认（auto）为 false
SkipDispatchForHudless=auto



; -------------------------------------------------------
[Framerate]
; -------------------------------------------------------
; 尽可能使用 Reflex 实现帧率限制
; 也包括 XeLL 或 AntiLag 2 等替代 Reflex 的技术
; 浮点数 — 默认（auto）为 0.0（禁用）
FramerateLimit=auto



; -------------------------------------------------------
[XeSS]
; -------------------------------------------------------
; 在初始化前构建 XeSS 管线
; true 或 false — 默认（auto）为 true
BuildPipelines=auto 

; 在初始化前为 XeSS 创建堆对象
; true 或 false — 默认（auto）为 true
CreateHeaps=auto 

; 选择 XeSS 网络模型
; 目前似乎没有效果
; 0 = KPSS | 1 = Splat | 2 = Model 3 | 3 = Model 4 | 4 = Model 5 | 5 = Model 6
; 默认（auto）为 0
NetworkModel=auto



; -------------------------------------------------------
[FSR]
; -------------------------------------------------------
; 设置 FSR 和 FSR FG 的相机垂直视场角（FOV）
; 0.0 至 180.0 — 默认（auto）为 60.0
VerticalFov=auto

; 未定义垂直视场角时，用于计算垂直视场角
; 0.0 至 180.0 — 默认（auto）为关闭
HorizontalFov=auto

; 设置 FSR 和 FSR FG 的相机近裁剪面
; 0.0 至浮点数最大值 — 默认（auto）为 0.1
CameraNear=auto

; 设置 FSR 和 FSR FG 的相机远裁剪面
; 0.0 至浮点数最大值 — 默认（auto）为 10000.0
CameraFar=auto

; 允许使用从 FSR2/3 或 FFX 输入
; 接收到的相机参数（近裁剪面、远裁剪面、视场角）
; true 或 false — 默认（auto）为 true
UseFsrInputValues=auto

; 启用 FSR3.X 超分辨率调试视图
; true 或 false — 默认（auto）为 false
DebugView=auto

; 选择 FSR3.X/4 的超分辨率后端
; 0 = FSR 4.0.2 | 1 = FSR 3.1.5 | 2 = FSR 2.3.4 
; 依 GPU 而定 — 默认（auto）为索引 0：RDNA4 使用 FSR4，其余使用 FSR3
UpscalerIndex=auto

; 选择 FFX 的帧生成后端
; 0 = FSR 4.0.0 | 1 = FSR 3.1.6
; 依 GPU 而定 — 默认（auto）为索引 0：RDNA4 使用 FSR4，其余使用 FSR3
FGIndex=auto

; 设置 FSR3.1.1 及以上版本的运动矢量系数
; 设为 0.0f 可改善明亮像素的时域稳定性
; 0.0 至 1.0 — 默认（auto）为 1.0
VelocityFactor=auto

; 设置 FSR3.1.4 及以上版本的反应性缩放
; 用于开发测试：检查向反应性遮罩写入更大数值能否减少拖影
; 0.0 至无穷大 — 默认（auto）为 1.0
ReactiveScale=auto

; 设置 FSR3.1.4 及以上版本的着色变化缩放
; 在读取 FSR3.1 计算出的着色变化值时进行缩放，以提高反应性
; 0.0 至无穷大 — 默认（auto）为 1.0
ShadingScale=auto

; 设置 FSR3.1.4 及以上版本每帧新增的累积量
; 对应发生遮挡显露或反应性遮罩值大于 0.0f 的像素坐标处，每帧增加的累积量
; 降低此值，并将产生拖影的物体（如无运动矢量的物体）以接近 1.0f 的值写入反应性遮罩，可减少时域拖影
; 降低此值可能导致更多细小特征像素闪烁
; 0.0 至 1.0 — 默认（auto）为 0.333
AccAddPerFrame=auto

; 设置 FSR3.1.4 及以上版本的最小遮挡显露累积量
; 提高此值可能减少摆动细小物体频繁相互显露时周围白色像素的时域闪烁
; 过高可能增加拖影。若该值足够负，则对第 N 帧显露的像素坐标，
; 从第 N+2 帧开始增加 fAccumulationAddedPerFrame
; -1.0 至 1.0 — 默认（auto）为 -0.333
MinDisOccAcc=auto

; 将原始 DLSS 反应性遮罩用作透明度遮罩
; true 或 false — 默认（auto）为 true
UseReactiveMaskForTransparency=auto

; 在 FSR 中使用 DLSS 反应性遮罩时应用的偏置
; 数值越高，越偏向新帧
; 0.0 - 0.9 - 默认（auto）为 0.45
DlssReactiveMaskBias=auto

; 强制 OptiScaler 尝试使用指定的 FSR 4 模型
; 请勿误以为不受支持的 GPU 能强制使用 FP8：驱动会回退到 FSR 3
; 0 = 不覆盖 | 1 = FP8 | 2 = INT8
; 0 至 2 — 默认（auto）为 0
Fsr4ForceModel=auto

; 选择要使用的 FSR4 内部预设
; 0 = FSR 原生抗锯齿 | 1 = 超高质量/质量 | 2 = 平衡 | 3 = 性能 | 4 = DRS | 5 = 超高性能
; 0 至 5 — 默认（auto）为游戏默认值
Fsr4Preset=auto

; 启用 FSR4 水印
; true 或 false — 默认（auto）为 false
Fsr4EnableWatermark=auto

; 禁止 OptiScaler 加载 amdxc64.dll
; true 或 false — 默认（auto）为 false
Fsr4DoNotLoadAmdxc64=auto

; 标明输入颜色资源使用非线性色彩空间
; 可能改善 FSR4 画质
; true 或 false — 默认（auto）为 false
FsrNonLinearColorSpace=auto

; 标明输入颜色资源包含感知编码的 sRGB 颜色
; 可能改善 FSR4 画质
; true 或 false — 默认（auto）为 false
FsrNonLinearSRGB=auto

; 标明输入颜色资源包含感知编码的 PQ 颜色
; 可能改善 FSR4 画质
; true 或 false — 默认（auto）为 false
FsrNonLinearPQ=auto

; 更新 DirectX 12 Agility SDK
; 使 Windows 10 上《赛博朋克 2077》等较早游戏能够使用 FSR4
; 必须将 D3D12_OptiScaler 文件夹复制到 OptiScaler 文件夹中！
; true 或 false — 默认（auto）为 false
FsrAgilitySDKUpgrade=auto



; -------------------------------------------------------
[DLSS]
; -------------------------------------------------------
; 允许调用原始 NVNGX
; true 或 false — 默认（auto）为 true
Enabled=auto

; 设为 true 以启用自定义渲染预设覆盖
; true 或 false — 默认（auto）为 false
RenderPresetOverride=auto

; 各画质档位的渲染预设
; 取决于 DLSS 版本，最新的对应顺序为
; 0 = 默认 | 1 = A | 2 = B | 3 = C | 4 = D | 5 = E | 6 = F | 7 = G
; 8 = H | 9 = I | 10 = J | 11 = K | 12 = L | 13 = M | 14 = N | 15 = O 
; 默认（auto）为 0
RenderPresetForAll=auto
RenderPresetDLAA=auto
RenderPresetUltraQuality=auto
RenderPresetQuality=auto
RenderPresetBalanced=auto
RenderPresetPerformance=auto
RenderPresetUltraPerformance=auto

; 为 NGX 使用通用 appid，修复某些游戏中 OptiScaler 预设覆盖不生效的问题
; true 或 false — 默认（auto）为 false
UseGenericAppIdWithDlss=auto



; -------------------------------------------------------
[DLSSD]
; -------------------------------------------------------
; 设为 true 以启用自定义渲染预设覆盖
; true 或 false — 默认（auto）为 false
RenderPresetOverride=auto

; 各画质档位的渲染预设
; 取决于 DLSSD 版本，最新的对应顺序为
; 0 = 默认 | 1 = A | 2 = B | 3 = C | 4 = D | 5 = E
; 默认（auto）为 0
RenderPresetForAll=auto
RenderPresetDLAA=auto
RenderPresetUltraQuality=auto
RenderPresetQuality=auto
RenderPresetBalanced=auto
RenderPresetPerformance=auto
RenderPresetUltraPerformance=auto



; -------------------------------------------------------
[NvngxFG]
; -------------------------------------------------------
; 修复 Windows 下 AMD GPU 在部分游戏（主要是非 UE 游戏）中的画面异常
; 可能导致卡顿，建议仅在确有需要且说明要求时使用
; true 或 false — 默认（auto）为 false
MakeDepthCopy=auto

; 接受任意标志位组合，例如 0x14100000
; 参考：https://github.com/artur-graniszewski/dlss-enabler-main/blob/a92464d468eb0d91ae17befa66c6bf6229f20b9f/Utils/DlssgProxy.cpp#L1033
; 任意标志位组合 — 默认（auto）为 0x10000000（IGNORE_UI_TEXTURE）
DispatchFlags = auto

; 控制传给 DLSSG.ShowDebug 的值
; 似乎只显示插入的帧
; true 或 false — 默认（auto）为 false
ShowDebug = auto

; 不向 DLSSG 发送无 HUD 资源
; 某些 DispatchFlags 组合可能需要此选项，参见上述参考资料
; true 或 false — 默认（auto）为 false
DisableHudless = auto



; -------------------------------------------------------
[Libraries]
; -------------------------------------------------------
; OptiScaler 查找以下 DLL 文件的主目录
; 默认为 .\OptiScaler
OptiDllPath=auto

; 以下选项用于分别覆盖各 DLL 的路径
; -----------------------------------------

; nvngx.dll 或 _nvngx.dll
NvngxPath=auto

; nvngx_dlss.dll
NvngxDlssPath=auto

; nvapi64.dll 或 fakenvapi.dll
NvapiPath=auto
                     
; amd_fidelityfx_dx12.dll 或 amd_fidelityfx_loader_dx12.dll
FfxDx12Path=auto

; amd_fidelityfx_upscaler_dx12.dll
FfxDx12SRPath=auto

; amd_fidelityfx_framegeneration_dx12.dll
FfxDx12FGPath=auto

; amd_fidelityfx_denoiser_dx12.dll
FfxDx12RRPath=auto

; amd_fidelityfx_radiancecache_dx12.dll
FfxDx12RCPath=auto

; amd_fidelityfx_vk.dll
FfxVkPath=auto

; libxess.dll
XeSSPath=auto

; libxess_fg.dll
XeFGPath=auto

; libxell.dll
XeLLPath=auto

; libxess_dx11.dll
XeSSDx11Path=auto

; 初始化时将此路径添加到 Nvngx 的搜索路径
NvngxFeaturePath=auto



; -------------------------------------------------------
[Menu]
; -------------------------------------------------------
; 启用新的 ImGui 叠加菜单
; 禁用此选项后，OptiScaler 将禁用所有帧生成功能
; true 或 false — 默认（auto）：OptiScaler 以 nvngx.dll 加载时为 false，否则为 true
OverlayMenu=auto

; 游戏内 ImGui 菜单缩放
; 0.5 至 2.0 — 默认（auto）为 1.0，低于 900p 时会减小
Scale=auto

; 打开菜单的快捷键
; 所有虚拟键码可在以下地址查询
; 请将按键描述与对应的键值匹配
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数 — 默认（auto）为 0x2D，即 VK_INSERT/Insert 键；旧默认值为 0x24，即 VK_HOME/Home 键
; 例如，若要使用 VK_BACK/Backspace 键，其值为 0x08，请设置 ShortcutKey=0x08
; -1 -> 不设置快捷键
ShortcutKey=auto
ShortcutKeyRequireCtrl=auto
ShortcutKeyRequireAlt=auto

; 将缩放比例的范围扩展为 0.1 - 6.0
; true 或 false — 默认（auto）为 false
ExtendedLimits=auto

; 菜单使用高质量字体
; 可能占用更多显存
; 若 Vulkan 下出现黑色叠加层或菜单相关崩溃，请尝试禁用
; true 或 false — 默认（auto）为 true
UseHQFont=auto

; 仅控制字体大小，不改变其他样式元素
; 通过 TTFFontPath 使用自定义字体时尤为有用
; 浮点数 — 默认（auto）为 14.0
FontSize=auto

; 用作高质量字体的字体路径，需要 UseHQFont=true
; 建议使用等宽字体
; 路径示例：C:\\Windows\\Fonts\\comic.ttf
; 默认（auto）为 OptiScaler 附带的 Hack-Regular 字体
TTFFontPath=auto

; 禁用启动提示信息
; true 或 false — 默认（auto）为 false
DisableSplash=auto

; 启用 FPS 叠加层
; true 或 false — 默认（auto）为 false
ShowFps=auto

; 游戏内 FPS 叠加层缩放
; 0.5 至 2.0 — 默认（auto）与菜单使用相同缩放
FpsScale=auto

; FPS 叠加层位置
; 0 = 左上 | 1 = 右上 | 2 = 左下 | 3 = 右下
; 0 至 3 — 默认（auto）为 0
FpsOverlayPos=auto

; FPS 叠加层类型
; 0 = 仅 FPS | 1 = 简洁 | 2 = 详细 | 3 = 详细 + 图表 | 4 = 完整 | 5 = 完整 + 图表 | 6 = Reflex 计时
; 0 至 6 — 默认（auto）为 0
FpsOverlayType=auto

; FPS 叠加层快捷键
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数 — 默认（auto）为 0x21，即 VK_PRIOR/Page up 键
; -1 -> 不设置快捷键
FpsShortcutKey=auto
ShortcutKeyRequireCtrl=auto
ShortcutKeyRequireAlt=auto

; 循环切换 FPS 叠加层类型的快捷键
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数 — 默认（auto）为 0x22，即 VK_NEXT/Page down 键
; -1 -> 不设置快捷键
FpsCycleShortcutKey=auto
ShortcutKeyRequireCtrl=auto
ShortcutKeyRequireAlt=auto

; 启用 FPS 叠加层横向布局
; true 或 false — 默认（auto）为 false
FpsOverlayHorizontal=auto

; FPS 叠加层背景不透明度
; 0.0 至 1.0 — 默认（auto）为 0.4
FpsOverlayAlpha=auto

; 启用/禁用帧生成的快捷键
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数 — 默认（auto）为 0x23，即 VK_END/End 键
; -1 -> 不设置快捷键
FGShortcutKey=auto
ShortcutKeyRequireCtrl=auto
ShortcutKeyRequireAlt=auto

; 叠加层使用主题颜色
; true 或 false — 默认（auto）为 false
OverlaysUseTheme=auto

; 菜单启用浅色主题
; true 或 false — 默认（auto）为 false
LightTheme=auto

; 菜单强调色
; 菜单强调色的 R/G/B 浮点分量
; 0.0 至 1.0 — 默认（auto）：R: 0.0, G: 0.4, B: 0.77（蓝色）
AccentColorR=auto
AccentColorG=auto
AccentColorB=auto

; 菜单背景色
; 菜单背景色的 R/G/B 浮点分量
; 0.0 至 1.0 — 默认（auto）：R: 0.0, G: 0.0, B: 0.0（黑色）
BGColorR=auto
BGColorG=auto
BGColorB=auto

; 菜单背景不透明度
; 0 为透明，1 为不透明
; 0.0 至 1.0 — 默认（auto）为 0.99
BGColorA=auto




; -------------------------------------------------------
[Spoofing]
; -------------------------------------------------------
; 伪装后的 VendorID（厂商 ID）
; 0x10de = Nvidia | 0x8086 = Intel | 0x1002 = AMD
; 整数 — 默认（auto）为 0x10de
SpoofedVendorId=auto

; 伪装后的 DeviceID（设备 ID）
; 0x2684 = 4090 | 0xE20B = B580 | 0x7550 9070 XT
; 整数 — 默认（auto）为 0x2684（4090）
SpoofedDeviceId=auto

; 需要被伪装的目标 VendorID
; 整数 — 默认（auto）为全部
TargetVendorId=auto

; 需要被伪装的目标 DeviceID
; 默认（auto）为全部
TargetDeviceId=auto

; 伪装后的 GPU 名称
; NVIDIA GeForce RTX 4090 | Intel(R) Arc(TM) B580 Graphics | AMD Radeon RX 9070 XT
; 默认（auto）为 NVIDIA GeForce RTX 4090
SpoofedGPUName=auto

; 为 Streamline 启用 GPU 伪装，即使游戏其余部分已禁用 DXGI 伪装
; 通常可在不伪装整个游戏的情况下使用 Fakenvapi，有时也可使用 DLSS/DLSSG
; true 或 false — 默认（auto）为 true
StreamlineSpoofing=auto

; 为 DXGI 启用 NVIDIA GPU 伪装（可通过上方设置改为伪装其他厂商）
; true 或 false — 默认（auto）：AMD/Intel 为 true，NVIDIA 为 false
Dxgi=auto

; 使用 DxgiFactory 包装器而非挂钩
; 可能引发问题，也可能改善 NVIDIA 显卡与其他模组的兼容性
; true 或 false — 默认（auto）为 false
DxgiFactoryWrapping=auto

; 当调用方法在列表中时跳过 DXGI GPU 伪装（示例：slInit|slGetPluginFunction|nvapi_QueryInterface）
; 注意：这会禁用后续调用的伪装，且不适用于 Linux
; 方法名以竖线“|”分隔 — 默认（auto）为禁用
DxgiBlacklist=auto

; 为 DXGI 伪装显存容量
; 伪装容量，单位 GB — 默认（auto）为禁用
DxgiVRAM=auto

; 为 Vulkan 启用 NVIDIA GPU 伪装（可通过上方设置改为伪装其他厂商）
; true 或 false — 默认（auto）为 false
Vulkan=auto

; 为 Vulkan 启用 NVIDIA 扩展伪装
; true 或 false — 默认（auto）为 false
VulkanExtensionSpoofing=auto

; 为 Vulkan 伪装显存容量
; 伪装容量，单位 GB — 默认（auto）为禁用
VulkanVRAM=auto

; 启用硬件加速 GPU 调度（HAGS）状态伪装
; Nukem 模组需要此选项；也可让 RTX 40xx 用户在未启用 HAGS 时使用 DLSSG
; true 或 false — 默认（auto）为 false，启用 DLSSG 模组时除外
SpoofHAGS=auto

; 允许覆盖所请求的 D3D 功能级别
; true 或 false — 默认（auto）为 false
D3DFeatureLevel=auto

; 使用 Intel 显卡并启用伪装时，
; 防止 UE 游戏提示不支持 DirectX 12
; true 或 false — 默认（auto）为 false
UEIntelAtomics=auto

; 在注册表层面伪装厂商 ID、设备 ID 和驱动版本
; true 或 false — 默认（auto）为 false
Registry=auto

; 在注册表中伪装的驱动版本
; 字符串 — 默认（auto）为 32.0.15.9155（NVIDIA）
RegistryDriver=auto

; 在 User32 层面伪装厂商 ID 和设备 ID
; true 或 false — 默认（auto）为 false
User32=auto



; -------------------------------------------------------
[Plugins]
; -------------------------------------------------------
; 搜索同名插件的路径（dxgi.dll、winmm.dll 等）
; 默认为 OptiDllPath 下的 plugins 目录：“.\OptiScaler\plugins\”
Path=auto

; 允许 OptiScaler 加载 plugins 文件夹中的 *.asi 文件
; true 或 false — 默认（auto）为 false
LoadAsiPlugins=auto

; 注入 plugins 文件夹中延迟加载的 *.asi 文件前的等待时间
; 要延迟加载 ASI 插件，请在扩展名前添加 -loadlate，例如“myplugin-loadlate.asi”
; 整数，单位秒 — 默认（auto）为 30
LateAsiPluginsDelay=auto

; 从游戏可执行文件所在目录加载 SpecialK64.dll
; 请在 SpecialK64.dll 旁创建空的 SpecialK.dxgi 文件，
; 以设置 SpecialK 的工作模式，否则不会启用
; 由于稳定性问题，启用 OPTIFG、通过 SL 使用 DLSSG 或启用 FSR-FG 输入时不会加载
; true 或 false — 默认（auto）为 false
LoadSpecialK=auto

; 从游戏可执行文件所在目录加载 Reshade64.dll
; 将 ReShade DLL 重命名为 ReShade64.dll，放在 OptiScaler 旁，并将此项设为 true
; true 或 false — 默认（auto）为 false
LoadReshade=auto

; 为所有检测到的 RDNA 2 GPU 加载自定义 amdxc64.dll
; OptiScaler 从 OptiDllPath 加载，例如“.\OptiScaler\amdxc64.dll”
; true 或 false — 默认（auto）为 false
LoadCustomAmdxc64OnRdna2=auto

; -------------------------------------------------------
[fakenvapi]
; -------------------------------------------------------
; 缺少 nvapi64.dll 时使用 fakenvapi
; fakenvapi 替代 nvapi 调用，允许使用 AntiLag 2 或 XeLL 等功能替代 Reflex
; 有时也需要此选项才能显示 DLSS/DLSSG
; true 或 false — 默认（auto）为 true
UseFakenvapi=auto

; 允许非 Intel 显卡在不使用帧生成时使用 XeLL，需要更新后的 libxell + libxess_fg
; 会禁用帧生成选项
; true 或 false — 默认（auto）为 false
ForceXeLL=auto

; 即使有更好的选项可用，也尝试使用 LatencyFlex
; 使用 XeFG 时不生效
; true 或 false — 默认（auto）为 false
ForceLatencyFlex=auto

; 控制 LatencyFlex 的工作方式
; 0 = 保守
; 1 = 激进，可降低延迟，但某些情况下 FPS 降幅会超过预期
; 2 = 使用 Reflex 帧 ID，部分游戏（如《赛博朋克》）不兼容，会回退到激进模式
; 默认（auto）为 0
LatencyFlexMode=auto

; 强制设置 Reflex 状态，适用于仅在使用 DLSSG 时启用 Reflex、且没有独立 Reflex 开关的游戏
; 0 = 跟随游戏设置 | 1 = 强制禁用 | 2 = 强制启用
; 默认（auto）为 0
ForceReflex=auto



; -------------------------------------------------------
[NvApi]
; -------------------------------------------------------
; 禁用 Flip Metering
; 修复使用 NukemFG 时 NVIDIA Flip Metering 导致的帧时间图变粗问题，需要 Fakenvapi
; true 或 false — 默认（auto）：NVIDIA 为 false，其他显卡为 true
DisableFlipMetering=auto



; -------------------------------------------------------
[Dx11withDx12]
; -------------------------------------------------------
; 创建 D11wDx12 功能时延迟部分操作，以提高兼容性
; true 或 false — 默认（auto）为 false
UseDelayedInit=auto

; 优先使用更底层的 D3D11_RESOURCE_MISC_SHARED，
; 性能略高，但兼容性可能较差
; true 或 false — 默认（auto）为 true
DontUseNTShared=auto



; -------------------------------------------------------
[Hooks]
; -------------------------------------------------------
; 提前挂钩内核方法
; 可能引发兼容性问题！！！
; true 或 false — 默认（auto）为 false
EarlyHooking=auto

; 跳过本地 nvngx 文件的挂钩，仅挂钩注册表指向的 nvngx
; Uniscaler + 帧生成需要此选项
; true 或 false — 默认（auto）为 false
HookOriginalNvngxOnly=auto

; 仅挂钩 ntdll.dll 的方法，跳过 kernel32.dll 和 kernelbase.dll 挂钩
; true 或 false — 默认（auto）为 true
UseNtdllHooks=auto



; -------------------------------------------------------
[Sharpness]
; -------------------------------------------------------
; 可用选项：
; RCAS - AMD 的鲁棒对比度自适应锐化（Robust Contrast-Adaptive Sharpening）
; DA - 使用基于深度的边缘检测进行锐化
;      减少跨物体边界的锐化，防止光晕和伪影
;      物体越远，施加的锐化越强（上限为 1.0）
;      推荐用于几何结构复杂或使用超分辨率的场景
; LCDA - 上述 DA 的局部对比度版本
; rcas、da 或 lcda — 默认（auto）为 rcas
Shader=auto

; 用固定的锐化值覆盖 DLSS 锐化参数
; true 或 false — 默认（auto）为 false
OverrideSharpness=auto

; 锐化强度
; 范围为 0.0 至 1.0（使用 RCAS 时上限为 1.3）— 默认（auto）为 0.3
Sharpness=auto



; -------------------------------------------------------
[OutputScaling]
; -------------------------------------------------------
; 为 DX12 及使用 DX12 后端的 DX11 启用输出缩放
; true 或 false — 默认（auto）为 false
Enabled=auto

; 输出缩放比例
; 0.5 - 3.0 - 默认（auto）为 1.5
Multiplier=auto

; 输出缩放使用的降采样器
; 0 = FSR1 | 1 = 双三次 | 2 = Catmull-Rom | 3 = Lanczos2 | 4 = Lanczos3 | 5 = Kaiser2 | 6 = Kaiser3 | 7 = MAGIC
; 0 至 7 — 默认（auto）为 0（FSR1）
Downscaler=auto



; -------------------------------------------------------
[CAS]
; -------------------------------------------------------
; 启用 RCAS 锐化
; true 或 false — 默认（auto）为 false
Enabled=auto

; 启用运动锐化
; true 或 false — 默认（auto）为 false
MotionSharpnessEnabled=auto

; 根据运动长度增加或减少锐化
; 范围为 -1.3 至 1.3 — 默认（auto）为 0.4
MotionSharpness=auto

; 像素移动多少距离后开始应用运动锐化
; 0.0 - 100.0 - 默认（auto）为 0.0
MotionThreshold=auto

; 像素移动多少距离后达到最大 MotionSharpness 值
; MotionThreshold 与此值之间的运动长度用于按比例调整锐化值
; 0.0 - 100.0 - 默认（auto）为 10.0
MotionScaleLimit=auto

; 启用基于对比度的锐化
; 提高高对比度区域的锐度
; true 或 false — 默认（auto）为 false
ContrastEnabled=auto

; 基于对比度的锐化值
; 值越高，高对比度区域越锐利
; 与较高锐化值搭配使用时，过高的值可能导致画面异常！！！
; 0.0 - 2.0  - 默认（auto）为 0.0
Contrast=auto

; 启用运动/DA 锐化的调试高亮
; 偏红表示增加锐化，偏绿表示减少锐化
; 蓝色表示深度感知锐化检测到的边缘
; true 或 false — 默认（auto）为 false
SharpenerDebug=auto

; 控制跨深度边缘的锐化抑制强度
; 值越高，越强烈地阻止物体边界处的锐化（减少光晕）
; 值越低，越允许跨边缘锐化（更锐利，但风险更高）
; 2.0 - 600.0  - 默认（auto）为 4.0
DADepthScale=auto

; 边缘检测前忽略微小的深度差异
; 值越高，越能减少轻微深度变化带来的噪点和闪烁
; 值越低，越能保留细节，但也可能对深度噪声产生反应
; 0.005 - 0.03  - 默认（auto）为 0.01
DADepthBias=auto

; 将最终图像限制在 [0, 1] 范围内
; 防止亮色光晕或负颜色等超调伪影
; 建议用于 LDR 管线；HDR 是否使用取决于色调映射
; true 或 false — 默认（auto）为 false
DAClampOutput=auto



; -------------------------------------------------------
[Magnifier]
; -------------------------------------------------------
; 启用放大镜
; 默认仅在菜单可见时显示，并跟随光标
; true 或 false — 默认（auto）为 false
Enabled=auto

; 放大镜半径，占屏幕高度的百分比
; 浮点数 — 默认（auto）为 15.0
Size=auto

; 放大镜的放大倍率
; 2 - 20 - 默认（auto）为 4
ZoomFactor=auto

; 放大镜黑色边框宽度，占屏幕高度的百分比
; 0.0 - 2.0 - 默认（auto）为 0.3
BorderSize=auto

; 放大镜相对于鼠标位置的偏移量，单位像素
; -1000 - 1000 - 默认（auto）为 0
CursorOffsetX=auto
CursorOffsetY=auto

; 放大镜的固定位置，以屏幕尺寸百分比表示
; 同时设置两个坐标值会切换到固定模式
; 固定模式下，即使菜单不可见，放大镜也始终显示
; 0 - 100 — 默认（auto）为不设置
StaticPosX=auto
StaticPosY=auto



; -------------------------------------------------------
[Log]
; -------------------------------------------------------
; 是否创建日志文件
; true 或 false — 默认（auto）为 false
LogToFile=auto

; 文件日志的详细级别
; 0 = 跟踪（Trace）/ 1 = 调试（Debug）/ 2 = 信息（Info）/ 3 = 警告（Warning）/ 4 = 错误（Error）
; 默认（auto）为 0 = 跟踪（Trace）
LogLevel=auto

; 输出日志到控制台（出于性能考虑，日志级别始终为 2，即 Info）
; true 或 false — 默认（auto）为 false
LogToConsole=auto

; 输出日志到 NVNGX API
; true 或 false — 默认（auto）为 false
LogToNGX=auto

; 输出日志到调试输出
; true 或 false — 默认（auto）为 false
LogToDebug=auto

; 打开日志控制台窗口
; true 或 false — 默认（auto）为 false
OpenConsole=auto

; 设为 false 时，每次运行 OptiScaler 都创建新的日志文件
; true 或 false — 默认（auto）为 true
SingleFile=auto

; 自定义日志文件名
; 也可以为日志指定自定义路径
; 默认（auto）为当前文件夹中的 OptiScaler.log
LogFileName=auto

; 启用异步日志
; true 或 false — 默认（auto）为 true
LogAsync=auto

; 异步日志线程数
; 1 - 8 - 默认（auto）为 1
LogAsyncThreads=auto



; -------------------------------------------------------
[InitFlags]
; -------------------------------------------------------
; 强制在初始化标志中添加 ENABLE_AUTOEXPOSURE
; 某些虚幻引擎游戏需要此项，可修复颜色问题，尤其是暗部
; true 或 false — 默认（auto）采用 DLSS 的值
AutoExposure=auto

; 强制在初始化标志中添加 HDR_INPUT_COLOR
; true 或 false — 默认（auto）采用 DLSS 的值
HDR=auto

; 强制在初始化标志中添加 INVERTED_DEPTH
; true 或 false — 默认（auto）采用 DLSS 的值
DepthInverted=auto

; 强制在初始化标志中添加 JITTERED_MV
; true 或 false — 默认（auto）采用 DLSS 的值
JitterCancellation=auto

; 强制在初始化标志中添加 HIGH_RES_MV
; true 或 false — 默认（auto）采用 DLSS 的值
DisplayResolution=auto

; 强制从初始化标志中移除 RESPONSIVE_PIXEL_MASK
; true 或 false — 默认（auto）为 true
DisableReactiveMask=auto



; -------------------------------------------------------
[UpscaleRatio]
; -------------------------------------------------------
; 设为 true 以启用内部渲染分辨率覆盖
; true 或 false — 默认（auto）为 false
UpscaleRatioOverrideEnabled=auto

; 设置强制使用的超分辨率缩放比例
; 默认（auto）为 1.3
UpscaleRatioOverrideValue=auto



; -------------------------------------------------------
[QualityOverrides]
; -------------------------------------------------------
; 设为 true 以启用自定义画质档位覆盖
; true 或 false — 默认（auto）为 false
QualityRatioOverrideEnabled=auto

; 为各画质档位设置自定义超分辨率缩放比例
;
; 默认（auto）值：
; DLAA					: 1.0
; 超高质量              : 1.3
; 质量                  : 1.5
; 平衡                  : 1.7
; 性能                  : 2.0
; 超高性能              : 3.0
QualityRatioDLAA=auto
QualityRatioUltraQuality=auto
QualityRatioQuality=auto
QualityRatioBalanced=auto
QualityRatioPerformance=auto
QualityRatioUltraPerformance=auto



; -------------------------------------------------------
[DRS]
; -------------------------------------------------------
; 设为 true，将 DRS 最小分辨率限制为渲染分辨率
; true 或 false — 默认（auto）为 false
DrsMinOverrideEnabled=auto

; 设为 true，将 DRS 最大分辨率限制为渲染分辨率
; true 或 false — 默认（auto）为 false
DrsMaxOverrideEnabled=auto



; -------------------------------------------------------
[HDR]
; -------------------------------------------------------
; 强制使用 HDR 色彩空间
; true 或 false — 默认（auto）为 false
ForceHDR=auto

; 使用 HDR10
; 使用 DXGI_FORMAT_R10G10B10A2_UNORM，而非 DXGI_FORMAT_R16G16B16A16_FLOAT
; true 或 false — 默认（auto）为 false
UseHDR10=auto

; 跳过 HDR 色彩空间设置
; true 或 false — 默认（auto）为 false
SkipColorSpace=auto



; -------------------------------------------------------
[V-Sync]
; -------------------------------------------------------
; 启用垂直同步控制
; true 或 false — 默认（auto）为 false
OverrideVsync=auto

; 强制设置垂直同步状态
; true 或 false — 默认（auto）为未选择
ForceVsync=auto

; 垂直同步的同步间隔
; 0 至 3 — 默认（auto）为未选择
SyncInterval=auto



; -------------------------------------------------------
[Anisotropy]
; -------------------------------------------------------
; 覆盖纹理的最大各向异性/各向异性过滤等级
; 2、4、8、16 — 默认（auto）为禁用
AnisotropyOverride=auto

; 将比较过滤器改为各向异性过滤器
; true 或 false — 默认（auto）为 true
ModifyComparison=auto

; 将最小值/最大值过滤器改为各向异性过滤器
; true 或 false — 默认（auto）为 true
ModifyMinMax=auto

; 跳过对点采样过滤器的覆盖
; true 或 false — 默认（auto）为 true
SkipPointFilter=auto



; -------------------------------------------------------
[Mipmap]
; -------------------------------------------------------
; 覆盖 Mipmap 的 LOD 偏置值
; -15.0 - 15.0 — 默认（auto）为禁用
MipmapBiasOverride=auto

; 使用固定的 LOD 偏置值
; true 或 false — 默认（auto）为 false
MipmapBiasFixedOverride=auto

; 将覆盖值用作缩放倍数
; true 或 false — 默认（auto）为 false
MipmapBiasScaleOverride=auto

; 覆盖所有纹理的 LOD 偏置（通常仅覆盖小于 0 的值）
; true 或 false — 默认（auto）为 false
MipmapBiasOverrideAll=auto



; -------------------------------------------------------
[ProcessFilter]
; -------------------------------------------------------
; 仅注入指定进程（不区分大小写）
; 示例：TargetProcessName=endfield.exe
; 默认（auto）为禁用（注入所有进程）
TargetProcessName=auto

; 不注入指定进程（不区分大小写）
; 进程名以竖线“|”分隔 — 默认（auto）为
; crashpad_handler.exe 等，具体见 Config.h 中的 ProcessFilter
ProcessExclusionList=auto



; -------------------------------------------------------
[Hotfix]
; -------------------------------------------------------
; 允许从 GitHub 检查最新版本
; true 或 false — 默认（auto）为 true
CheckForUpdate=auto

; 允许阻止 Steam 和 Epic 叠加层
; 同时会阻止 Steam Input
; true 或 false — 默认（auto）为 false，OptiFG 除外，其默认值为 true
DisableOverlays=auto

; 使用手动输入轮询，而非挂钩 WndProc
; 可能帮助无法正确捕获输入的游戏
; 缺点是菜单打开时无法阻止输入传递给游戏
; true 或 false — 默认（auto）为 false
ManualInputPolling=auto

; 为帧生成交换链模拟可等待对象的事件信号
; true 或 false — 默认（auto）为 false
SimulateWaitableObject=auto

; OptiScaler 将延迟加载 ReShade，并先创建 D3D12 设备
; 可防止 Luma 和部分其他 ReShade 模组引发警告或崩溃
; 使用 Luma 模组时会启用此项
; true 或 false — 默认（auto）为 false
CreateD3D12DeviceForLuma=auto

; OptiScaler 将尝试强制使用高性能 GPU
; true 或 false — 默认（auto）为 false
PreferDedicatedGpu=auto

; OptiScaler 将仅报告第一块高性能 GPU
; true 或 false — 默认（auto）为 false
PreferFirstDedicatedGpu=auto

; 将内部渲染分辨率的宽度和高度取整为此值的倍数
; 2、4、8、16…… — 默认（auto）为禁用
RoundInternalResolution=auto

; 跳过前 n 帧的超分辨率处理
; n 为整数 — 默认（auto）为禁用
SkipFirstFrames=auto

; 超分辨率处理后恢复上一次使用的计算根签名
; true 或 false — 默认（auto）为 false
RestoreComputeSignature=auto

; 超分辨率处理后恢复上一次使用的图形根签名
; true 或 false — 默认（auto）为 false
RestoreGraphicSignature=auto

; 尝试跟踪根签名变更，以完整恢复状态
; 适用于使用无绑定（bindless）资源的游戏
; true 或 false — 默认（auto）为 false
ExtendedStateRestore=auto

; 为 RCAS、输出缩放和遮罩偏置使用预编译着色器
; true 或 false — 默认（auto）为 true
UsePrecompiledShaders=auto

; 修正颜色纹理资源状态，以修复 AMD 显卡上的彩虹色异常（主要用于 UE 游戏）
; AMD 显卡运行 UE 游戏时，将 Color 设为 4（D3D12_RESOURCE_STATE_RENDER_TARGET）
ColorResourceBarrier=auto
; AMD 显卡运行 UE 游戏时，将 MotionVector 设为 8（D3D12_RESOURCE_STATE_UNORDERED_ACCESS）
MotionVectorResourceBarrier=auto
DepthResourceBarrier=auto
ColorMaskResourceBarrier=auto
ExposureResourceBarrier=auto
OutputResourceBarrier=auto

; 默认（auto）为禁用状态修正
; 以下设置指定各资源的初始资源状态，
; 并添加资源屏障以切换到正确状态
;
; 常用资源屏障状态
; ----------------------------------------------------
; D3D12_RESOURCE_STATE_COMMON = 0,
; D3D12_RESOURCE_STATE_VERTEX_AND_CONSTANT_BUFFER = 1,
; D3D12_RESOURCE_STATE_INDEX_BUFFER	= 2,
; D3D12_RESOURCE_STATE_RENDER_TARGET = 4,
; D3D12_RESOURCE_STATE_UNORDERED_ACCESS	= 8,
; D3D12_RESOURCE_STATE_DEPTH_WRITE = 16,
; D3D12_RESOURCE_STATE_DEPTH_READ = 32,
; D3D12_RESOURCE_STATE_NON_PIXEL_SHADER_RESOURCE = 64,
; D3D12_RESOURCE_STATE_PIXEL_SHADER_RESOURCE = 128,
;------------------------------------------------------
; 
; 所有状态值可在此处查阅
; https://learn.microsoft.com/en-us/windows/win32/api/d3d12/ne-d3d12-d3d12_resource_states

[DlssNr]
; 可选的基于颜色的最终编辑过滤器（并非 NVIDIA 的语义 AutoMask）
; 暖色场景可能被误识别；彩色光照可能掩盖肤色。请先预览，再决定是否使用
; 这些控制仅对所有模型轮次的合并输出应用一次。0..1 用于衰减编辑效果
SkinProtection=false
SkinDetail=1.0
SkinColour=1.0
EnvironmentDetail=1.0
EnvironmentColour=1.0
ShowSkinMask=false
ToggleKey=auto
; DLSS 5 神经渲染。在超分辨率输出中合成细节，然后再交给帧生成
;
; 需要将 nvngx_dlssnr.dll 310.8 放在 OptiScaler 或游戏可执行文件旁
; NR 通过已安装的 NVIDIA NGX 驱动调度，不使用额外的辅助 DLL
; 运行库兼容性与安装详情请参阅 INSTALL-DLSSNR.md
;
; 使用未公开的 NGX 功能，因此所有这些功能均不受官方支持
; true 或 false — 默认（auto）为 false
Enabled=auto

; 勾选/true：在普通 SR 或组合 RR+SR 之前，对当前有效的颜色输入运行 NR
; 未勾选/false：在上述任一超分辨率后端之后运行 NR。两者都使用下方的 WorkingScale 和 Passes
; 在 RR 之前运行时，NR 处理带噪声的光追颜色；实际视觉效果需要测试
; 从原点开始且带填充的输入使用其有效尺寸。颜色输入无效或存在偏移时，回退到超分辨率之后运行
; true 或 false — 默认（auto）为 false
RunBeforeSR=auto

; 在游戏完成光照和特效后应用 NR，无论是否启用帧生成均可使用
; 仅支持原生 DirectX 12，也可能影响 HUD
; RunBeforeSR=true 时，在 SR 之前生成 NR，再将其放大后的改动应用到最终画面
; 此颜色传递是近似处理，使用独立的 DLSS SR；此组合不支持 RR
FinishedPicture=false

; 实验性：在 SR 之前生成 NR、并应用到最终画面时，测量 HDR 亮度传递
; 仅支持场景线性输入的 HDR10/scRGB。不可靠区域使用常规的有界传递
; 会增加一次干净帧复制和一个小型 GPU 分析步骤，调色结果仍是近似的
HdrTransfer=false

; 实验性：在 SR 之前生成 NR，使用独立的 SR 功能放大其
; 带正负号的颜色贡献，再于 SR 之后应用。优先于 RunBeforeSR，不适用于 RR
; 失败时保留干净的超分辨率帧。DeferredDLSS 沿用旧键名
DeferredDLSS=auto
; 仅用于独立 NR 超分辨率后端：0 = DLSS（默认），1 = FSR 2.2（内置），2 = FSR（FidelityFX 运行库），3 = XeSS
; FidelityFX 从已加载的运行库中选择受支持的提供者。XeSS 需要其运行库及受支持的输入尺寸
; 独立于主超分辨率后端。不自动回退到其他后端。不支持原生 Vulkan
PrivateUpscaler=auto
; 实验性：RunBeforeSR 和游戏光线重建同时开启时，在 SR 之前运行 NR，
; 但保持颜色输入不变，再将模型的编辑叠加回 RR+SR 输出，
; 使其不被 RR 降噪消除。编辑结果以运动矢量重投影的时域累积器承载
; 仅在 RunBeforeSR 和 RR 均启用时生效。true 或 false — 默认（auto）为 false
ResidualAcrossRR=auto
; ResidualAcrossRR 累积器的历史混合率，范围 0.01 至 1
; 值越低越稳定，但效果显现越慢；1.0 表示不累积（直接使用逐帧残差，会闪烁）
; 默认（auto）为 0.08
ResidualAcrossRRBlend=auto

; 优先降噪（仅原生 DirectX 12）：以 1:1 比例对原始渲染画面运行游戏自身的超分辨率后端，
; 使 NR 在渲染分辨率下处理干净、已降噪且无抖动的图像，而非带噪声和抖动的输入。
; 游戏启用光线重建时使用 RR，否则使用普通 DLSS，不会强制切换。NR 在干净图像上运行后，
; 由 DenoiseFirstStep 决定如何将结果送至屏幕。启用时优先于 RunBeforeSR，
; 不与 DeferredDLSS 或 FinishedPicture 组合使用。true 或 false — 默认（auto）为 false
DenoiseFirst=auto
; NR 编辑干净图像后的处理方式：
;   0 = 将编辑后的干净图像交给游戏正常超分辨率后端，抖动量设为零
;   1 = 使用独立普通 DLSS SR（零抖动）放大编辑后的干净图像，并替换输出
;   2 = 取 NR 的改动（NR 减干净图像），按该帧抖动偏移移动以对齐原始渲染图像，
;       加到原始图像上，再交给游戏正常超分辨率后端（默认）
; 默认（auto）为 2
DenoiseFirstStep=auto
; 仅适用于步骤 2：0 = 差值（NR - 干净图像，相加），1 = 比值（NR / 干净图像，相乘）
; 比值保留各带噪样本自身的色相；差值会重着色暗部样本，并使超分辨率后端收到的颜色噪声加倍
; 默认（auto）为 1
DenoiseFirstEdit=auto
; 仅适用于步骤 2：重采样位移后改动的核。0 = 双线性，1 = Catmull-Rom，2 = Lanczos 2
; 默认（auto）为 1
DenoiseFirstKernel=auto
; 仅适用于步骤 2：按该帧抖动偏移移动改动。关闭则不移动，便于对比
; true 或 false — 默认（auto）为 true
DenoiseFirstShift=auto
; 仅适用于步骤 2：翻转抖动位移方向。不同引擎约定不同；方向错误会加剧错位
; true 或 false — 默认（auto）为 false
DenoiseFirstFlipJitter=auto
; 仅适用于步骤 2：将重采样后的改动限制在最近源像素的范围内，以抑制振铃
; true 或 false — 默认（auto）为 false
DenoiseFirstNeighbourhoodClamp=auto
; 仅适用于步骤 2 的比值模式：远比干净图像明亮的样本可能是路径追踪的萤火噪点；
; 乘以比值会让它更亮，游戏的 RR 可能将其保留为闪光。启用保护后，此类样本改用
; 对应像素的绝对变化；关闭则直接应用比值。true 或 false — 默认（auto）为 true
DenoiseFirstFireflyGuard=auto

; SR 与 RR+SR 共用 RunBeforeSR、WorkingScale 和 Passes
; 旧版 ApplyAfterRR、RRPasses 和 RRWorkingScale 键将被忽略

; 一次编码与最终合成之间串行运行的模型层数。每个额外层
; 使用前一层模型输出，并拥有独立的持久功能实例和历史。1 层为正常模式；
; 2 层和 3 层会刻意过度处理，模型耗时几乎分别为 2 倍和 3 倍。最终
; 仅相对于不可变的基础代理图像合成一次，因此颜色与传递效果不会逐层叠加
; 数值限制在 1..3
; 默认（auto）为 1
Passes=auto
; 可选扩展范围，最多 30 轮。常规上限仍为 3；关闭时没有额外工作量
; 额外的逐轮设置键：Pass4Style/Intensity/LocalStructure/LocalTone/SkinStructure/AutoMask 等
; 未指定的控制项继承第 1 轮，但后续轮次的局部色调默认值为 0
UnlockPasses=false

; 控制画面向模型结果靠近的程度。模型结果不是直接加到原帧上：它是一张
; 完整图像，会重新缩放至原图要求的亮度位置，然后在两者之间混合。
; 0 精确返回超分辨率后端的原始输出，1 为模型图像，大于
; 1 则继续向模型图像之外外推
; 默认（auto）为 1.0
TransferStrength=auto

; 控制是否随亮度一起引入模型的颜色。0 精确保留游戏原有色相，仅由
; 亮度承载模型效果；1 则同时引入模型的颜色及其自身色相
; 默认（auto）为 1.0
ColourStrength=auto

; 编码时映射到显示白色的线性值。它取决于游戏曝光，而非某个
; 固定数值：某游戏实测帧均值范围为 0.065 至 185。使用自动设置时，
; 会从当前帧测量。它不仅改变模型看到的内容，也会影响最终结果：提供给
; 模型的图像亮度也是合成权衡的一部分。仅适用于线性缓冲区；
; 游戏报告为已完成色调映射的帧会直接跳过，不作修改
; true 或 false — 默认（auto）为 true
; 在模型接收画面前对上述白点乘以此系数，即纸白控制
; 默认（auto）为 1.0
; 0 = 软拐点，1 = Neutwo 合成，2 = Neutwo 替换，3 = 混合合成，4 = 混合替换
ReversibleMode=auto
WhitePointScale=auto
; 0 = 手动，1 = 游戏曝光，3 = 自动 HDR 曝光。默认 0
WhitePointSource=auto
WhitePointTrim=auto
; 自动微调默认值为 5。高光保护范围为 0-100（默认 0）
AutoExposureTrim=auto
AutoExposureHighlightProtection=auto
; 最多八组以空格分隔的“基础白点:微调”数值对；按白点排序
ExposureTrimAnchors=auto
AutoExposureTrimAnchors=auto
; 分辨率低于 100% 时替换模式的细节强度，范围 0-2。默认 0 保留现有输出
ReplaceDetailStrength=auto
; RR 残差置信度阈值，0 表示禁用自适应（默认）
ResidualConfidenceSensitivity=auto
; 可选的 RR 残差历史过滤器：输入变化后剔除旧改动，并按邻近的当前改动裁剪
; 仅用于 ResidualAcrossRR。默认 false 保持现有过滤行为
HistoryRejection=auto
; 可选的暗边修正，在最后一轮 NR 后应用一次。强度为 0 至 1，默认 0（关闭）
; HaloSuppression 处理明亮边缘的暗侧；HaloBrightSuppression 同时处理亮侧
HaloSuppression=auto
HaloBrightSuppression=auto
; 半径以 NR 工作像素计，范围 1 至 4，默认 2。可能提亮真实阴影，保持启用前请对比效果
HaloRadius=auto

; 每轮允许将任意像素增亮到原值的最大倍数。变暗不受
; 限制。用于防止模型将亮光变成一串彩色块
; 默认（auto）为 2.0
MaxRatio=auto

; 模型工作的分辨率比例。原帧本身不会缩小，只有模型
; 在较小尺寸上工作后再放大，开销随此比例的平方降低。大于 1.0 时（DX12 和 Vulkan），
; 模型进行超采样：以高于原生分辨率运行，再将结果平均降采样
; 默认（auto）为 1.0
WorkingScale=auto

; 可选的周边压缩，与 WorkingScale 组合使用。默认禁用
; Centre/Work 为各轴尺寸百分比；偏移和位移为带正负号的百分比
; 启用后的默认布局：中心 80%，工作区 90%。中心细节同样受 WorkingScale 影响
SpatialCompression=auto
SpatialCenterX=auto
SpatialCenterY=auto
SpatialWorkX=auto
SpatialWorkY=auto
SpatialOffsetX=auto
SpatialOffsetY=auto
SpatialShiftX=auto
SpatialShiftY=auto
; 仅叠加显示边框，不会将其包含在模型输入中
SpatialShowCenter=auto
SpatialShowWork=auto

; 低于 100% 时的放大方式：0 = 经典，1 = 匹配残差（默认），2 = 匹配残差 + DLSS，
; 3 = 光照 + 颜色，4 = 光照 + 颜色 + DLSS，5 = 边缘感知。DLSS 需要在 DX12 超分辨率处理后运行
; “光照 + 颜色”分别调整相对光照与颜色的尺寸；纯黑像素保持纯黑
; 边缘感知通过原始亮度引导 4x4 滤波器，限制改动跨越边缘；会增加 GPU 工作量
Transfer=auto

; WorkingScale 大于 1.0 时，将模型结果平均降采样回原生分辨率的降采样器
; （超采样）。独立于 OutputScaling/Downscaler，因此两者可以不同。0 = FSR1，1 = 双三次，
; 2 = CatmullRom，3 = Lanczos2，4 = Lanczos3，5 = Kaiser2，6 = Kaiser3，7 = MAGIC
; 默认（auto）为 4 (Lanczos3)
ScalingDownscaler=auto

; 0 = 关闭，1 = 解包后的代理图像，2 = 解包后的原始模型结果，3 = 将改动放大二十倍，
; 4 = 解包前的压缩模型输入（也由空间压缩的预览复选框控制）
; 差异视图若呈均匀灰色，表示模型没有作出改动
; 默认（auto）为 0
DebugView=auto

; 首次运行此处理时，将匹配的处理前/后帧写入 OptiScaler 旁的 dlssnr-capture 文件夹
; 最多八帧，每次运行都会覆盖上一次结果
; true 或 false — 默认（auto）为 true

; 模型控制项。Preset 和 Style 固化在各功能实例中，因此修改它们后，
; 会等待当前 GPU 工作完成，再安全地重建功能实例。NR 预设与 SR/RR 预设互不相同
; Preset：0 = 自动（已安装运行库的默认值），1 = 原始，2 = 优化版（较小的 FP8 模型）
; 优化版包含于 NR 310.9.16.0；旧版运行库回退到其自带的默认值
; 默认（auto）为 0
Preset=auto
Style=auto

; 第 2、3 轮设为 auto 时继承上方第 1 轮的 Preset/Style。可覆盖这些值，
; 为该层选择不同模型：preset 为 0 = 自动，1 = 原始，2 = 优化版；
; style 为 0 = 标准，1 = 自然，2 = 电影。后续轮次继承第 1 轮的模型。
; 这些模型/配置位于同一个 NVIDIA 模型 DLL 内
Pass2Preset=auto
Pass2Style=auto
Pass3Preset=auto
Pass3Style=auto

; 逐轮模型强度（SR 与 RR+SR 共用）
; auto 继承第 1 轮，但 LocalTone 除外：auto 保留后续轮次的旧默认值 0
; Intensity/LocalStructure/LocalTone：0..2；SkinStructure：-1..2（-1 表示跟随结构）
Pass2Intensity=auto
Pass2LocalStructure=auto
Pass2LocalTone=auto
Pass2SkinStructure=auto
Pass2AutoMask=auto
Pass3Intensity=auto
Pass3LocalStructure=auto
Pass3LocalTone=auto
Pass3SkinStructure=auto
Pass3AutoMask=auto

; 默认（auto）为 1.0
Intensity=auto
LocalStructure=auto
LocalTone=auto
; -1 表示跟随局部结构，这是模型自身的默认行为，并非强度为零
; 默认（auto）为 -1.0
SkinStructure=auto
; true 或 false — 默认（auto）为 true
AutoMask=auto
